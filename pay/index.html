<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Pockvo — запрос на перевод</title>
<link rel="icon" href="../favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="../assets/mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<style>
  :root { --bg:#121211; --card:#1c1b19; --line:rgba(243,239,230,.1); --text:#f3efe6; --muted:#a39d90; --accent:#ff4d1a; --ink:#141414; --warn:#f2c14e; color-scheme: dark; }
  @media (prefers-color-scheme: light) { :root { --bg:#f3efe6; --card:#fbf9f4; --line:rgba(20,20,20,.12); --text:#141414; --muted:#69645a; --warn:#8a5d00; color-scheme: light; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); display: grid; place-items: center; padding: 24px 16px; overflow-x: hidden; }
  body::before { content: ''; position: fixed; z-index: -1; top: -18vmin; right: -18vmin; width: 52vmin; height: 52vmin; border-radius: 50%; background: var(--accent); }
  .card { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 28px 22px 22px; animation: in .6s cubic-bezier(.22,1,.36,1) both; }
  @keyframes in { from { opacity: 0; transform: translateY(16px); } }
  @media (prefers-reduced-motion: reduce) { .card { animation: none; } }
  .logo { width: 52px; height: 52px; border-radius: 12px; margin: 0 auto 14px; background: url('../assets/mark.svg') center / cover no-repeat; color: transparent; font-size: 0; }
  .who { text-align: center; color: var(--muted); font-weight: 600; font-size: 15px; }
  .amount { text-align: center; font-size: 36px; font-weight: 800; letter-spacing: -.03em; margin: 6px 0 2px; word-break: break-word; font-variant-numeric: tabular-nums; }
  .net { text-align: center; font-weight: 700; font-size: 14px; }
  .net span { display: inline-block; padding: 4px 10px; border-radius: 7px; background: rgba(255,77,26,.14); color: var(--accent); }
  .memo { text-align: center; color: var(--muted); font-style: italic; margin-top: 10px; word-break: break-word; }
  .label { margin: 22px 0 8px; font-size: 13px; color: var(--muted); font-weight: 650; }
  .addr { font-family: ui-monospace, Consolas, monospace; font-size: 14px; line-height: 1.55; padding: 14px; border-radius: 12px; border: 1px solid var(--line); word-break: break-all; background: rgba(127,120,100,.08); }
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 52px; border-radius: 12px; border: 0; font: inherit; font-weight: 700; font-size: 15px; cursor: pointer; text-decoration: none; margin-top: 10px; transition: background-color .2s, color .2s, transform .15s; }
  .btn:active { transform: scale(.97); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .primary { background: var(--accent); color: var(--ink); }
  .primary:hover { background: var(--text); color: var(--bg); }
  .secondary { background: transparent; color: var(--text); border: 1.5px solid var(--line); }
  .secondary:hover { border-color: var(--text); }
  .warn { margin-top: 16px; font-size: 13px; line-height: 1.5; color: var(--warn); background: rgba(242,193,78,.08); border: 1px solid rgba(242,193,78,.3); padding: 12px 14px; border-radius: 12px; }
  .foot { margin-top: 14px; text-align: center; font-size: 12.5px; color: var(--muted); }
  .foot a { color: var(--muted); }
  .bad { text-align: center; padding: 20px 0; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 30px); opacity: 0; background: var(--card); border: 1px solid var(--line); padding: 10px 16px; border-radius: 10px; font-weight: 700; transition: .3s; }
  .toast.on { transform: translate(-50%, 0); opacity: 1; }
</style>
</head>
<body>
<main class="card" id="card"></main>
<div class="toast" id="toast"></div>
<script>
(function () {
  var ru = /^(ru|uk|be|kk)/i.test(navigator.language || '');
  var L = ru ? {
    asks: ' просит перевести', req: 'Запрос на перевод', any: 'Любая сумма', net: 'Сеть', addr: 'Адрес получателя',
    open: 'Открыть в Pockvo', copy: 'Скопировать адрес', copied: 'Адрес скопирован', get: 'Скачать Pockvo',
    warn: 'Отправляйте только {s} в сети {n}. Монеты из другой сети пропадут. Сверьте адрес с получателем.',
    bad: 'Ссылка повреждена или неполная.', note: 'Данные ссылки не отправляются на сервер.'
  } : {
    asks: ' asks you to send', req: 'Payment request', any: 'Any amount', net: 'Network', addr: 'Recipient address',
    open: 'Open in Pockvo', copy: 'Copy address', copied: 'Address copied', get: 'Get Pockvo',
    warn: 'Send only {s} on the {n} network. Coins from another network will be lost. Check the address with the recipient.',
    bad: 'The link is broken or incomplete.', note: 'The link details are never sent to a server.'
  };
  var NETS = { btc: 'Bitcoin', ltc: 'Litecoin', eth: 'Ethereum', bsc: 'BNB Smart Chain', polygon: 'Polygon', arbitrum: 'Arbitrum One', optimism: 'Optimism', base: 'Base', avax: 'Avalanche C-Chain', sol: 'Solana', tron: 'TRON' };
  var q = new URLSearchParams(location.hash.slice(1));
  var c = q.get('c'), to = q.get('to') || '', amt = q.get('amt') || '', s = (q.get('s') || '').slice(0, 16), n = (q.get('n') || '').slice(0, 40), m = (q.get('m') || '').slice(0, 80);
  var card = document.getElementById('card');
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; card.appendChild(e); return e; }
  el('div', 'logo', 'P');
  if (!c || !Object.prototype.hasOwnProperty.call(NETS, c) || !to || to.length > 120 || (amt && !/^\d{1,18}(\.\d{1,18})?$/.test(amt))) { el('div', 'bad', L.bad); return; }
  el('div', 'who', n ? n + L.asks : L.req);
  el('div', 'amount', amt ? amt + ' ' + s : L.any + (s ? ' · ' + s : ''));
  var net = el('div', 'net'); var sp = document.createElement('span'); sp.textContent = NETS[c]; net.appendChild(sp);
  if (m) el('div', 'memo', '«' + m + '»');
  el('div', 'label', L.addr);
  el('div', 'addr', to);
  var app = el('a', 'btn primary', L.open); app.href = 'pockvo://pay?' + location.hash.slice(1);
  var cp = el('button', 'btn secondary', L.copy);
  cp.onclick = function () {
    (navigator.clipboard ? navigator.clipboard.writeText(to) : Promise.reject()).then(function () {
      var tt = document.getElementById('toast'); tt.textContent = L.copied; tt.className = 'toast on'; setTimeout(function () { tt.className = 'toast'; }, 1800);
    }).catch(function () { prompt(L.addr, to); });
  };
  el('div', 'warn', L.warn.replace('{s}', s || '—').replace('{n}', NETS[c]));
  var foot = el('div', 'foot'); var a = document.createElement('a'); a.href = 'https://pokvo.space/#download'; a.textContent = L.get; foot.appendChild(a);
  foot.appendChild(document.createTextNode(' · ' + L.note));
})();
</script>
</body>
</html>
