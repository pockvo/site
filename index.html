<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pockvo</title>
<meta name="description" content="Pockvo — ваш собственный криптокошелёк. Ключи хранятся только на вашем устройстве." />
<style>
  :root { --bg: #07080f; --text: #f3f4fa; --muted: #9aa3c7; --accent: #7c5cff; --accent-2: #22d3ee; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 24px 16px; }
  main { text-align: center; max-width: 520px; }
  h1 { font-size: 44px; margin: 0 0 8px; letter-spacing: -0.02em; background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p { color: var(--muted); margin: 0; }
</style>
</head>
<body>
<main>
  <h1>Pockvo</h1>
  <p>Ваш собственный криптокошелёк. Сайт скоро откроется.</p>
</main>
</body>
</html>
